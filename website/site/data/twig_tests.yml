---
- name: path_readable
  code: >-
    {% if "@site/data" is path_readable %}
      Path or file is readable
    {% endif %}
  desc: Tests if the given alias or path exists and is readable.
  return:
    - bool
    - Whether the alias or path exists and is readable.
- name: path_writable
  code: >-
    {% if "@site/data" is path_writable %}
      Path or file is writable
    {% endif %}  
  desc: Tests if the given alias or path exists and is writable.
  return:
    - bool
    - Whether the alias or path exists and is writable.
