-
  id: contact
  name: Contact
  desc: Contact adds a simple contact form with name, email and message fields to a website created with Herbie.
  composer:
  github: https://github.com/getherbie/herbie/tree/3.x/plugins/contact
  packagist:
  enabled: true
-
  id: dummy
  name: Dummy
  desc: This system plugin shows all possibilities how to extend Herbie.
    The plugin is helpful during development, but should be disabled in productive environment.
  composer:
  github: https://github.com/getherbie/herbie/tree/3.x/plugins/dummy
  packagist:
  status: stable
  enabled: true
-
  id: imagine
  name: Imagine
  desc: This system plugin integrates Imagine, an OOP image editing library, into your Herbie website.
    Thanks to Imagine, you can edit images directly and apply ready-made filters and effects to them. 
  composer:
  github: https://github.com/getherbie/herbie/tree/3.x/plugins/imagine
  packagist:
  enabled: true
-
  id: markdown
  name: Markdown
