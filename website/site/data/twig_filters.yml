---
- name: format_bytes
  code: >-
    {{ 12345678|format_bytes }}
  desc: Returns file size in a human readable format (B, KB, MB, GB, TB, PB).
  return:
    - string
    - The file size in human readable format
- name: slugify
  code: >-
    {{ "A string with spaces, Umlauts or special characters (?!&#)."|slugify }}
  desc: Returns a string slug for using as an URL segment.
  return:
    - string
    - The slugified string
- name: spaceless
  code: >-
    {{ "<div>   <strong>foo</strong>   </div>"|spaceless }}
  desc: Removes whitespace between HTML tags. Herbie provides this filter because Twig deprecated the filter of the same name in 3.12.
  return:
    - string
    - The input without whitespace between HTML tags
- name: twigify
  code: >-
    {{ "Hello {{ page.title }}"|twigify }}
  desc: Renders a string with Twig and returns the result.
  return:
    - string
    - The rendered string
