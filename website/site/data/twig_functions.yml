---
- name: html_attributes
  code: >-
    {{ html_attributes({class: 'btn', disabled: true, hidden: false, title: null}) }}
  desc: Renders an associative array of HTML attributes into an escaped string. `null` and `false` values are omitted; `true` renders a boolean attribute. Attribute names are escaped with the `html_attr_relaxed` strategy.
  params:
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: strategy
      type: string
      desc: The Twig escaping strategy used for attribute values, for example `html_attr`, `html`, `js`, `url`, or `css`.
      default: "'html_attr'"
  return:
    - string
    - The rendered HTML attributes
- name: url_abs
  code: >-
    {{ url_abs('doc/contents/variables') }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `page_url(route, absolute: true)` instead. Returns the absolute URL for a given route.'
  params:
    - name: route
      type: string
      desc: The route to a page. An empty route resolves to the site root.
      default: "''"
  return:
    - string
    - The absolute URL.
- name: page_url
  code: >-
    {{ page_url('doc/contents/variables', absolute: true) }}
  desc: Returns the URL for a given route. Use this when you only need the URL string, not a complete HTML link element.
  params:
    - name: route
      type: string
      desc: The route to a page. An empty route resolves to the site root.
      default: "''"
    - name: absolute
      type: bool
      desc: If true, the URL includes scheme and host of the current request.
      default: 'false'
  return:
    - string
    - The URL
- name: css_add
  code: >-
    {{ css_add('@theme/css/styles.css', {class: 'styles'}, 'default', false, 1) }}
  desc: Registers a CSS asset for output by `css_out`. Use `raw=true` to include the CSS inline.
  params:
    - name: paths
      type: string|array
      desc: One or more paths to CSS resources.
      required: true
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: group
      type: string|null
      desc: The asset group name.
      default: 'null'
    - name: raw
      type: bool
      desc: If true, paths is treated as inline CSS content and rendered in a `style` tag instead of being referenced by URL.
      default: 'false'
    - name: position
      type: int
      desc: The sort position of the asset within its group.
      default: '1'
  return:
    - void
- name: js_add
  code: >-
    {{ js_add('@theme/js/script.js', {class: 'scripts'}, 'default', false, 1) }}
  desc: Registers a JavaScript asset for output by `js_out`. Use `raw=true` to include the script inline.
  params:
    - name: paths
      type: string|array
      desc: One or more paths to JavaScript resources.
      required: true
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: group
      type: string|null
      desc: The asset group name.
      default: 'null'
    - name: raw
      type: bool
      desc: If true, paths is treated as inline JavaScript content and rendered in a `script` tag instead of being referenced by URL.
      default: 'false'
    - name: position
      type: int
      desc: The sort position of the asset within its group.
      default: '1'
  return:
    - void
- name: css_classes
  code: >-
    {{ css_classes() }}
  desc: 'Returns a string with CSS classes, to be used within an HTML attribute, for example the html or body tag.
    This allows to address any page, theme, layout or language via CSS selector.
    Such a string looks like: "page-blog theme-default layout-blog language-en"'
  return:
    - string
    - The string with CSS classes.
- name: link_file
  code: >-
    {{ link_file('media/download.pdf', 'Download', {class:'download'}, true) }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `file_link()` instead. The path is resolved like in `file_url()`.'
  params:
    - name: path
      type: string
      desc: The public path to the file, for example `/media/download.pdf` or `/files/info.pdf`.
      required: true
    - name: label
      type: string
      desc: The link label. If empty, the file basename is used.
      default: "''"
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: show_info
      type: bool
      desc: If true, file extension and size are appended to the label.
      default: 'false'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_file.twig'"
  return:
    - string
    - The rendered HTML
- name: file_link
  code: >-
    {{ file_link('/media/manual.pdf', 'Manual', {class: 'download'}, download: true) }}
  desc: 'Returns an HTML link to a file. The URL is resolved like in `file_url()`; `download: true` forces a download of a media file and `absolute: true` includes scheme and host.'
  params:
    - name: path
      type: string
      desc: The public path to the file, for example `/media/download.pdf` or `/files/info.pdf`.
      required: true
    - name: label
      type: string
      desc: The link label. If empty, the file basename is used.
      default: "''"
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: show_info
      type: bool
      desc: If true, file extension and size are appended to the label.
      default: 'false'
    - name: download
      type: bool
      desc: 'Forces a download by appending `?download`. Has an effect on media files only.'
      default: 'false'
    - name: absolute
      type: bool
      desc: If true, the URL includes scheme and host of the current request.
      default: 'false'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_file.twig'"
  return:
    - string
    - The rendered HTML
- name: image
  code: >-
    {{ image('/media/portrait.jpg', {width: 100, height: 200, alt: 'Portrait', class: 'photo'}) }}
  desc: Returns an HTML image element for a file. A path below `/media/` is served by Herbie from `@media`, every other path is relative to the web root. See `file_url()`. No image processing is performed.
  params:
    - name: src
      type: string
      desc: The public path to the image file, for example `/media/portrait.jpg` or `/logo.png`.
      required: true
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/image.twig'"
  return:
    - string
    - The HTML image element
- name: file_url
  code: >-
    {{ file_url('/media/manual.pdf', download: true) }}
  desc: 'Returns the public URL for a file. A path below the media URL (`urls.media`, by default `/media/...`) is served by Herbie from `@media`: types a browser can display are opened inline, everything else is downloaded, and `download: true` appends `?download` to force a download. Every other path is relative to the web root and served by the web server. Base URL and script name are added automatically. With `absolute: true` the URL includes scheme and host of the current request. External URLs and anchors are returned unchanged.'
  params:
    - name: path
      type: string
      desc: The public path to the file, for example `/media/manual.pdf` or `/logo.png`.
      required: true
    - name: download
      type: bool
      desc: 'Forces a download by appending `?download`. Has an effect on media files only.'
      default: 'false'
    - name: absolute
      type: bool
      desc: If true, the URL includes scheme and host of the current request.
      default: 'false'
  return:
    - string
    - The public URL
- name: menu_ascii_tree
  code: >-
    {{ menu_ascii_tree('doc', 2, true) }}
  desc: Returns a text-based ASCII tree of pages.
  params:
    - name: route
      type: string
      desc: The route of the branch to render. If empty, the full page tree is used.
      default: "''"
    - name: depth
      type: int
      desc: The maximum depth level of the tree (-1 = unlimited).
      default: '-1'
    - name: hidden
      type: bool
      desc: If true, hidden pages are included.
      default: 'false'
  return:
    - string
    - The rendered ASCII tree
- name: menu_breadcrumb
  code: >-
    {{ menu_breadcrumb(' / ', ['', 'Homepage'], false, '@snippet/menu_breadcrumb.twig') }}
  desc: Returns a breadcrumb navigation for the current page trail.
  params:
    - name: delimiter
      type: string
      desc: The delimiter passed to the template.
      default: "''"
    - name: home
      type: array
      desc: Optional home item as [route, label]. Pass an empty array to omit it.
      default: '[]'
    - name: reverse
      type: bool
      desc: If true, the breadcrumb items are reversed.
      default: 'false'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/menu_breadcrumb.twig'"
  return:
    - string
    - The rendered HTML
- name: menu_list
  code: >-
    {{ menu_list('type=blog', '-title', false, 10, '@snippet/menu_list.twig') }}
  desc: Returns a paginated list of pages. The current page is read from the "page" query parameter by default.
  params:
    - name: where
      type: array|string
      desc: One or more where conditions passed to the query builder.
      default: "''"
    - name: order
      type: string
      desc: The order field(s) passed to the query builder.
      default: "''"
    - name: shuffle
      type: bool
      desc: If true, the pages are shuffled before querying.
      default: 'false'
    - name: limit
      type: int
      desc: The number of items per page.
      default: '10'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/menu_list.twig'"
  return:
    - string
    - The rendered HTML
- name: menu_pager
  code: >-
    {{ menu_pager('doc/contents/', 'Previous', 'Next', '&lt;', '&gt;', 'pager', '@snippet/menu_pager.twig') }}
  desc: Returns a pager with links to the previous and next page within the current page branch.
  params:
    - name: prefix
      type: string
      desc: Limits the pager to pages whose route starts with this prefix.
      default: "''"
    - name: prev_label
      type: string
      desc: The label for the previous link. If empty, the page menu title is used.
      default: "''"
    - name: next_label
      type: string
      desc: The label for the next link. If empty, the page menu title is used.
      default: "''"
    - name: prev_icon
      type: string
      desc: The icon markup for the previous link.
      default: "''"
    - name: next_icon
      type: string
      desc: The icon markup for the next link.
      default: "''"
    - name: class
      type: string
      desc: The CSS class name passed to the template.
      default: "'pager'"
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/menu_pager.twig'"
  return:
    - string
    - The rendered HTML
- name: menu_sitemap
  code: >-
    {{ menu_sitemap('doc', 1, false, 'sitemap') }}
  desc: Returns an HTML sitemap as a nested unordered list. This is an alias for `menu_tree()` with `sitemap` as the default CSS class.
  params:
    - name: route
      type: string
      desc: The route of the branch to render. If empty, the full page tree is used.
      default: "''"
    - name: depth
      type: int
      desc: The maximum depth level of the tree (-1 = unlimited).
      default: '-1'
    - name: hidden
      type: bool
      desc: If true, hidden pages are included.
      default: 'false'
    - name: class
      type: string
      desc: The CSS class for the root list element.
      default: "'sitemap'"
  return:
    - string
    - The rendered HTML
- name: menu_tree
  code: >-
    {{ menu_tree('doc', 1, false, 'menu') }}
  desc: Returns an HTML navigation tree as a nested unordered list.
  params:
    - name: route
      type: string
      desc: The route of the branch to render. If empty, the full page tree is used.
      default: "''"
    - name: depth
      type: int
      desc: The maximum depth level of the tree (-1 = unlimited).
      default: '-1'
    - name: hidden
      type: bool
      desc: If true, hidden pages are included.
      default: 'false'
    - name: class
      type: string
      desc: The CSS class for the root list element.
      default: "'menu'"
  return:
    - string
    - The rendered HTML
- name: css_out
  code: >-
    {{ css_out('default', true) }}
  desc: Returns the HTML markup for the registered CSS assets of a group.
  params:
    - name: group
      type: string|null
      desc: The asset group to output. If null, the default group is used.
      default: 'null'
    - name: timestamp
      type: bool
      desc: If true, a timestamp query parameter is appended to asset URLs.
      default: 'false'
  return:
    - string
    - The HTML markup for the CSS assets
- name: js_out
  code: >-
    {{ js_out('default', true) }}
  desc: Returns the HTML markup for the registered JavaScript assets of a group.
  params:
    - name: group
      type: string|null
      desc: The asset group to output. If null, the default group is used.
      default: 'null'
    - name: timestamp
      type: bool
      desc: If true, a timestamp query parameter is appended to asset URLs.
      default: 'false'
  return:
    - string
    - The HTML markup for the JavaScript assets
- name: link_download
  code: >-
    {{ link_download('dummy.pdf', 'My dummy file', {class: 'link-file'}, true) }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `file_link("/media/...", ..., download: true)` instead. Returns an HTML link to a file in `@media` that forces a download (`/media/...?download`). Unlike `file_link()`, the `/media/` prefix is added automatically.'
  params:
    - name: path
      type: string
      desc: The path to the file relative to @media. The prefix `/media/` is optional.
      required: true
    - name: label
      type: string
      desc: The link label. If empty, the file basename is used.
      default: "''"
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: show_info
      type: bool
      desc: If true, file extension and size are appended to the label.
      default: 'false'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_download.twig'"
  return:
    - string
    - The rendered HTML
- name: link_mail
  code: >-
    {{ link_mail('me@example.com', 'John Doe', {class: 'link-page'}, '@snippet/link_mail.twig') }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `mail_link()` instead. Returns an HTML mailto link.'
  params:
    - name: email
      type: string
      desc: The email address.
      required: true
    - name: label
      type: string|null
      desc: The link label. If null, the email address is used.
      default: 'null'
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_mail.twig'"
  return:
    - string
    - The rendered HTML
- name: mail_link
  code: >-
    {{ mail_link('me@example.com', 'John Doe', {class: 'link-page'}, '@snippet/link_mail.twig') }}
  desc: Returns an HTML mailto link.
  params:
    - name: email
      type: string
      desc: The email address.
      required: true
    - name: label
      type: string|null
      desc: The link label. If null, the email address is used.
      default: 'null'
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_mail.twig'"
  return:
    - string
    - The rendered HTML
- name: link_page
  code: >-
    {{ link_page('doc/contents/variables', 'Content variables', {class: 'link-page'}) }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `page_link()` instead. Returns an HTML link for a given route or URL. Use `page_url()` when you only need the URL string.'
  params:
    - name: route
      type: string
      desc: The route or the URL to a page.
      required: true
    - name: label
      type: string
      desc: The link label.
      required: true
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_page.twig'"
  return:
    - string
    - The rendered HTML
- name: page_link
  code: >-
    {{ page_link('doc/contents/variables', 'Content variables', {class: 'link-page'}) }}
  desc: 'Returns an HTML link for a given route or URL. Use `page_url()` when you only need the URL string. `absolute: true` includes scheme and host for internal routes; external URLs are kept unchanged.'
  params:
    - name: route
      type: string
      desc: The route or the URL to a page.
      required: true
    - name: label
      type: string
      desc: The link label.
      required: true
    - name: attribs
      type: array
      desc: The HTML attributes passed as an associative array.
      default: '[]'
    - name: absolute
      type: bool
      desc: If true, the URL of an internal route includes scheme and host of the current request.
      default: 'false'
    - name: template
      type: string
      desc: The aliased path to the template file.
      default: "'@snippet/link_page.twig'"
  return:
    - string
    - The rendered HTML
- name: page_title
  code: >-
    {{ page_title(delimiter=' / ', site_title='My Blog', root_title='Welcome to My Blog', reverse=true) }}
  desc: Returns the assembled page title for the current page trail.
  params:
    - name: delimiter
      type: string
      desc: The delimiter between title segments.
      default: "' / '"
    - name: site_title
      type: string
      desc: The website title. If not empty, it is prepended before reversal.
      default: "''"
    - name: root_title
      type: string
      desc: The title used on the root/start page instead of the normal page title.
      default: "''"
    - name: reverse
      type: bool
      desc: If true, the assembled title segments are reversed.
      default: 'false'
  return:
    - string
    - The page title
- name: snippet
  code: >-
    {{ snippet('@site/custom-snippet.twig', {foo: 'bar'}) }}
  desc: Renders a Twig snippet template and returns the result. Automatic escaping is disabled for all escaping strategies.
  params:
    - name: path
      type: string
      desc: The aliased or relative path to the snippet template.
      required: true
    - name: context
      type: array
      desc: The variables passed to the snippet as an associative array.
      default: '[]'
  return:
    - string
    - The rendered snippet
- name: query
  code: >-
    {{ query(data).where('type=page').where('title*=news').limit(3).order('-date').all() }}
  desc: Creates a query builder for iterable data. The returned builder can filter, sort, limit, and paginate the data.
  params:
    - name: data
      type: iterable
      desc: The data to be queried.
      required: true
  return:
    - QueryBuilder
    - The query builder
- name: translate
  code: >-
    {{ translate('app', 'Plugin {plugin} enabled but not found!', {plugin: 'dummy'}) }}
  desc: Translates a message using the configured translator and current locale.
  params:
    - name: category
      type: string
      desc: The translation category.
      default: "''"
    - name: message
      type: string
      desc: The message to translate.
      default: "''"
    - name: params
      type: array
      desc: The placeholder parameters passed to the translator.
      default: '[]'
  return:
    - string
    - The translated message
- name: twigify
  code: >-
    {{ twigify('Hello {{ page.title }}') }}
  desc: Renders a string as a Twig template in the current context and returns the result.
  params:
    - name: content
      type: string
      desc: The string to render as a Twig template.
      required: true
  return:
    - string
    - The rendered string
- name: url_rel
  code: >-
    {{ url_rel('doc/contents') }}
  desc: 'Deprecated since 3.3.0, removed in 4.0: use `page_url()` instead. Returns the relative URL for a given route.'
  params:
    - name: route
      type: string
      desc: The route to a page. An empty route resolves to the site root.
      default: "''"
  return:
    - string
    - The relative URL.
