services:
  website:
    build:
      context: .
    profiles: [website]
    working_dir: "/app/website" 
    command: ["php", "-S", "0.0.0.0:80", "-t", "/app/website/web"]
    volumes:
      - .:/app
    ports:
      - "8888:80"
    depends_on:
      - install
  install:
    build:
      context: .
    profiles: [website]
    working_dir: "/app" 
    command: ["composer", "install"]
    volumes:
      - .:/app
  test:
    build:
      context: .
    profiles: [website]
    working_dir: "/app" 
    command: ["php", "vendor/bin/codecept", "run"]
    volumes:
      - .:/app
  test-website:
    build:
      context: .
    profiles: [website]
    working_dir: "/app/tests/_data"
    command: ["php", "-S", "0.0.0.0:80", "-t", "/app/tests/_data/web"]
    volumes:
      - .:/app
    ports:
      - "8888:80"
  bash:
    build:
      context: .
    profiles: [website]
    working_dir: "/app"
    command: ["bash"]
    volumes:
      - .:/app
