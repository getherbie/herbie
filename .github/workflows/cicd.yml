# GitHub Action for Herbie
name: CI/CD for Herbie
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: CI - Analyse & Test
    strategy:
      matrix:
        # macOS runners are expensive: only test on release tags and manual runs,
        # Ubuntu is sufficient for regular pushes and pull requests.
        operating-system: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        php-versions: ['8.3', '8.4', '8.5', '8.6']
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docs: https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          ini-values: register_argc_argv=On
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Use composer.json for key, if composer.lock is not committed.
          # key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run static checks
        run: composer qa:check

      - name: Prepare test config
        run: |
          sed -e "s|<plugin_contact_recipient>|test@example.com|g" \
              -e "s|<plugin_contact_csrf_secret>|test-csrf-secret|g" \
              -e "s|<plugin_contact_captcha_secret>|test-captcha-secret|g" \
              website/site/config/main.dist.php > website/site/config/main.php

      - name: Run tests
        run: composer qa:test

  publish:
    name: CD - Push to server
    needs: test
    if: github.ref == 'refs/heads/3.x'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          ini-values: register_argc_argv=On

      - name: Install PHP dependencies
        run: |
          # Packagist may lag behind a push: retry, and abort if the commit never shows up
          for i in 1 2 3 4 5 6; do
            composer update getherbie/herbie --working-dir website --no-dev --prefer-dist --no-progress --no-suggest --optimize-autoloader
            grep -q "$GITHUB_SHA" website/composer.lock && exit 0
            sleep 10
          done
          echo "Herbie $GITHUB_SHA was not installed" >&2
          exit 1

      - name: Configure SMTP secrets
        run: |
          sed -i "s|<plugin_contact_smtp_host>|${{ secrets.SMTP_HOST }}|g" website/site/config/main.dist.php
          sed -i "s|<plugin_contact_smtp_username>|${{ secrets.SMTP_USERNAME }}|g" website/site/config/main.dist.php
          sed -i "s|<plugin_contact_smtp_password>|${{ secrets.SMTP_PASSWORD }}|g" website/site/config/main.dist.php
          sed -i "s|<plugin_contact_recipient>|${{ secrets.SMTP_RECIPIENT }}|g" website/site/config/main.dist.php
          sed -i "s|<plugin_contact_csrf_secret>|$(openssl rand -hex 32)|g" website/site/config/main.dist.php
          sed -i "s|<plugin_contact_captcha_secret>|$(openssl rand -hex 32)|g" website/site/config/main.dist.php

      - name: Deploy main.php to site config
        run: cp website/site/config/main.dist.php website/site/config/main.php

      - name: Rename index-prod.php
        run: rm website/web/index.php && mv website/web/index-prod.php website/web/index.php

      - name: Smoke test
        working-directory: website/web
        run: |
          php -S 127.0.0.1:9371 index.php > /tmp/smoke-server.log 2>&1 &
          sleep 2
          base=http://127.0.0.1:9371
          paths=$(curl -sf "$base/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's|<[^>]*>||g' -e 's|^https\?://[^/]*||')
          test -n "$paths" || { echo "No pages found in sitemap.xml" >&2; exit 1; }
          for path in $paths "/search?query=herbie"; do
            curl -sf -o /dev/null "$base$path" || { echo "Smoke test failed: $path" >&2; tail -20 /tmp/smoke-server.log >&2; exit 1; }
          done

      - name: Deploy to server via scp
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "website"
          target: ${{ secrets.SSH_TARGET }}
          rm: true
          strip_components: 1
