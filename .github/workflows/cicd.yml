# GitHub Action for Herbie
name: CI/CD for Herbie
on: [push, pull_request]
jobs:
  test:
    name: CI - Analyse & Test
    strategy:
      matrix:
        # operating-systems: ubuntu-latest, windows-latest, macos-latest
        operating-system: [ubuntu-latest, macos-latest]
        php-versions: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docs: https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring
          ini-values: register_argc_argv=On
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Use composer.json for key, if composer.lock is not committed.
          # key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Lint PHP files
        run: composer lint

      - name: Check code style with PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Check Twig template style with Twig-CS-Fixer
        run: vendor/bin/twig-cs-fixer lint --config .twig-cs-fixer.php

      - name: Analyse code with PHPStan
        run: vendor/bin/phpstan analyse --memory-limit 256M

      - name: Test code with Codeception
        run: vendor/bin/codecept run

  publish:
    name: CD - Push to server
    needs: test
    if: github.ref == 'refs/heads/2.x' || github.ref == 'refs/heads/3.x-develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          ini-values: register_argc_argv=On

      - name: Install PHP dependencies
        run: composer install --working-dir website --no-dev --prefer-dist --no-progress --no-suggest --optimize-autoloader

      - name: Configure SMTP secrets
        run: |
          sed -i "s|<smtp_host>|${{ secrets.SMTP_HOST }}|g" website/site/config/main.dist.php
          sed -i "s|<smtp_username>|${{ secrets.SMTP_USERNAME }}|g" website/site/config/main.dist.php
          sed -i "s|<smtp_password>|${{ secrets.SMTP_PASSWORD }}|g" website/site/config/main.dist.php
          sed -i "s|<smtp_recipient>|${{ secrets.SMTP_RECIPIENT }}|g" website/site/config/main.dist.php
          sed -i "s|<csrf_secret>|$(openssl rand -hex 32)|g" website/site/config/main.dist.php

      - name: Deploy main.php to site config
        run: cp website/site/config/main.dist.php website/site/config/main.php

      - name: Rename index-prod.php
        run: rm website/web/index.php && mv website/web/index-prod.php website/web/index.php

      - name: Deploy to server via scp
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "website"
          target: ${{ secrets.SSH_TARGET }}
          rm: true
          strip_components: 1
